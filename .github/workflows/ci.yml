name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'prod' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run typecheck
      - run: npm test
      # The Cloudflare Vite plugin emits the worker, the assets and a redirected wrangler config
      # (.wrangler/deploy/config.json) that `wrangler deploy` picks up automatically.
      - run: npm run build

      - name: Ensure R2 bucket
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler r2 bucket info f1-bundles >/dev/null 2>&1 || npx wrangler r2 bucket create f1-bundles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # One-time migration from v1: the old API worker owns f1-api.edge-mega.com. Remove this step once deployed.
      - name: Remove v1 API worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler delete --name f1-api-cache-production --force || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
