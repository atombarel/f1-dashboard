name: Ops

# Manual production diagnostics: ingestion status and the latest Workflow instances.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ingestion status
        run: |
          curl -s -H "Authorization: Bearer $ADMIN_TOKEN" https://f1-api.edge-mega.com/api/admin/status | jq .
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      - name: Latest workflow instances
        run: |
          npx wrangler workflows instances list f1-ingest-session || true
          for id in $(npx wrangler workflows instances list f1-ingest-session --json 2>/dev/null | jq -r '.[0:3][].id'); do
            npx wrangler workflows instances describe f1-ingest-session "$id" || true
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
